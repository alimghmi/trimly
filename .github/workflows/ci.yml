name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.12.3'

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check --diff .

  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trimly
          POSTGRES_USER: trimly
          POSTGRES_PASSWORD: trimly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trimly -d trimly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-8f3b1d9c2e4a6075b1c3d5e7f9a0b2c4
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: trimly
      POSTGRES_USER: trimly
      POSTGRES_PASSWORD: trimly
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Django system checks
        run: uv run python manage.py check --deploy --fail-level ERROR

      - name: Verify no missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run python manage.py test --verbosity 2 --shuffle

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: trimly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check the image
        run: docker run --rm trimly:ci python manage.py check
